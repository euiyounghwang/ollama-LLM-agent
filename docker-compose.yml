services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - bridge

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - bridge
      
      
  fn-ollama-api:
    image: fn-ollama-api:es
    container_name: fn-ollama-api
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - 17777:7777
    volumes:
      - ./:/app/FN-Ollama-Services
    # restart: unless-stopped
    environment:
      - ES_HOST=http://host.docker.internal:9203
    networks:
      - bridge

volumes:
  ollama_data:
  open-webui_data:

networks:
  bridge:
    driver: bridge